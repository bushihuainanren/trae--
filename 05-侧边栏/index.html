<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>侧边栏效果</title>
  <link rel="stylesheet" href="//at.alicdn.com/t/c/font_4875044_xtl4xkn67d.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 这是第一个问题的解决方法 */
    a {
      /* 清除下划线 */
      text-decoration: none;
      color: #9a9cae;
    }

    /* 这是第二个问题的解决办法   不让用ul{margin:100px 200px;}
    以及span{position:absolute;left:90px;}这种魔法定位 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    ul {
      list-style: none;
      width: 80px;
      background-color: #1e1e2d;
      margin: 100px 200px;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 10px;
    }

    ul li {
      margin-bottom: 15px;
    }

    /* 这是第三个问题的解决方法  以前我是利用伪元素来划的分割线，现在直接一个小li就解决了 */
    .divider {
      height: 1px;
      background-color: #9a9cae;
      margin: 30px 0;
    }

    .nav-link {
      /* 为了解决无障碍阅读 导致的黑框  关掉默认的outline黑框 */
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 40px;
      height: 40px;
      position: relative;
      border-radius: 10px;
      color: #9a9cae;
    }

    .nav-link span {
      /* 第四个问题这是透明度  后续不要用all 来进行了 直接
      opacity：0; visibility:hidden; 就行 visibility是隐藏的意思 */
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* 解决这个absolute定位后文字超出宽度的问题，就是字会掉下来
      white-space: nowrap强制不换行    */
      white-space: nowrap;
      height: 40px;
      font-size: 16px;
      position: absolute;
      border-radius: 8px;
      color: #fff;
      /* 这也是魔法定位问题  问题二的改版  我以前写法是left:90px;而不是用
      left: 100%;
      margin-left: 35px;这种方法解决的 */
      left: 100%;
      margin-left: 35px;
      letter-spacing: 3px;
      background-color: #7f5af0;
      text-align: center;
      line-height: 40px;
      transition: opacity 0.3s, visibility 0.3s;
      padding: 0 10px;
    }

    .nav-link span::before {
      content: '';
      display: block;
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      left: -7px;
      transform: translateY(-50%) rotate(45deg);
      background-color: #7f5af0;
      z-index: -1;
    }

    /* :focus-within 伪类选择器  当元素或其子元素获得焦点时触发  对于无障碍阅读及其友好*/
    .nav-link:hover span,
    .nav-link:focus-within span {
      /* 问题四的解决方法 */
      opacity: 1;
      visibility: visible;
      /* 问题四添加了这个属性 pointer-events: none 是为了点击span时不会触发点击事件
      但是如果加了:focus-within 这个选择器就必须把pointer-events: none设置成auto */
      pointer-events: none;
    }

    .nav-link:hover {
      background-color: #7f5af0;
    }

    .nav-link:hover i {
      color: #fff;
    }

    .nav-link:focus-visible {
      outline: 2px solid #7f5af0;
    }
  </style>
</head>

<body>
  <ul>
    <!-- 第一个问题：语义化不够 
     <li>
      <i class="iconfont icon-shouye"></i>
      <span>首页</span>
    </li>   这是你自己的写法
      -->
    <li>
      <a href="https://www.baidu.com" class="nav-link">
        <i class="iconfont icon-shouye"></i>
        <span>首页</span>
      </a>
    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-chanpinguanli"></i>
        <span>商品管理</span>
      </a>
    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-huiyuanguanli"></i>
        <span>会员管理</span>
      </a>
    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-baobao-shoutibao"></i>
        <span>订单管理</span>
      </a>
    </li>

    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-qia"></i>
        <span>财务中心</span>
      </a>
    </li>
    <!-- divider 分割线 -->
    <li class="divider">

    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-tongzhi"></i>
        <span>通知</span>
      </a>
    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-shezhi"></i>
        <span>设置</span>
      </a>
    </li>
    <li>
      <a href="#" class="nav-link">
        <i class="iconfont icon-ren"></i>
        <span>个人中心</span>
      </a>
  </ul>
</body>

</html>
