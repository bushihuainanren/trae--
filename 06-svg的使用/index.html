<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>svg的使用</title>
  <style>
    svg {
      width: 50px;
      height: 50px;
      /* fill 是填充颜色 */
      fill: none;
      /* stroke 是边框的颜色  也可以称为是描边的颜色 要和宽度一起设置 不然不生效 */
      stroke: blue;
      /* stroke-width 是边框的宽度  可以设置为像素值 也可以设置为百分比 也可以是一个数 */
      stroke-width: 10;
      /* stroke-dasharray 是边框的虚线数组 第一个数字为实现的长度，第二个数值为间隔的长度
      ----  实线-和--两个-之间的间隔组成了虚线  可以设置为像素值 也可以设置为百分比 也可以是一个数
      可以利用这个给svg添加动画效果  */
      stroke-dasharray: 2613;
      /* animation: draw 3s linear; */
      /* stroke-dashoffset 是于调整虚线模式的起始偏移量 增大stroke-dashoffset,让虚线模式向路径起点移动，视觉上像线条被擦除一样
      也就是说可以让整个实现都消失 可以利用这个 做画心的案例   可以设置为像素值 也可以设置为百分比（不准） 也可以是一个数 */
      stroke-dashoffset: 2613;
      animation: draw 5s linear infinite;
    }


    /*     @keyframes draw {
      0% {
        stroke-dasharray: 0 100%;
      }

      100% {
        stroke-dasharray: 100% 0;
      }
    } */
    /* 实现画心效果 */
    @keyframes draw {
      0% {
        stroke-dashoffset: 2614;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
