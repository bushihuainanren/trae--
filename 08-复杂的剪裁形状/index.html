<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08-灯光秀</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 10rem;
      color: #292929;
      position: relative;
    }

    h1::after {
      /* 动态读取数据，防止硬编码 */
      content: attr(data-text);
      background: linear-gradient(to right, #ff69b3, #fe0000, #ffa401, #ffff01, #008102, #40e1d2, #410898, #9400d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: absolute;
      top: 0;
      left: 0;
      /* 这是我自己写的  AI给了我更适合的写法 */
      /* animation: move 3s linear infinite; */
      clip-path: inset(0 100% 0 0);
      animation: sweep 3s linear infinite;
    }


    @keyframes move {

      /* -webkit-clip-path: circle(50% at 56% 43%);
        clip-path: circle(50% at 56% 43%); 
        https://tools.jb51.net/static/api/css3path/index.html   这是网址*/
      0% {
        -webkit-clip-path: circle(20% at 0 50%);
        clip-path: circle(20% at 0 50%);
      }

      50% {
        -webkit-clip-path: circle(20% at 100% 50%);
        clip-path: circle(20% at 100% 50%);
      }

      100% {
        -webkit-clip-path: circle(20% at 0% 50%);
        clip-path: circle(20% at 0% 50%);
      }
    }
  </style>
</head>

<body>
  <h1 class="text" data-text="hello world">hello world</h1>
</body>

</html>
